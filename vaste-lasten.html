<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vaste lasten">
<title>Vaste lasten</title>
<style>
:root{--bg:#F4F0E8;--card:#FBF9F4;--ink:#1D2320;--dim:#6F746F;--line:#DDD6C8;--ok:#1F6B57;--due:#B5541C}
@media(prefers-color-scheme:dark){:root{--bg:#121512;--card:#1A1E1B;--ink:#EDEBE4;--dim:#8E948E;--line:#2A2F2B;--ok:#4FB594;--due:#E8895A}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent}
.num{font-family:ui-serif,Georgia,serif;font-variant-numeric:tabular-nums}
header{padding:calc(14px + env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{background:none;border:1px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:20px;font-size:18px}
.mt{text-align:center;text-transform:capitalize;font-weight:600;font-size:17px}
.per{text-align:center;color:var(--dim);font-size:12px;margin-top:2px;text-transform:none}
.tl{margin-top:14px;display:flex;justify-content:space-between;align-items:baseline}
.tl span{color:var(--dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.tl b{font-size:34px;font-weight:600}
main{flex:1;overflow-y:auto;padding:8px 20px 20px}
ul{list-style:none}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.chk{flex:none;width:30px;height:30px;border-radius:15px;border:2px solid var(--dim);background:none;color:#fff;font-size:16px}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done .chk::after{content:"✓"}
.mid{flex:1;min-width:0}
.nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{font-size:12px;color:var(--dim);margin-top:2px}
.am{font-size:17px}
.done .nm,.done .am{text-decoration:line-through;color:var(--dim)}
.off{opacity:.55}
.hint{font-size:12px;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:36px 0;font-size:14px}
form{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
form h3{grid-column:1/-1;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500}
input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;width:100%}
.w{grid-column:1/-1}
.btn{grid-column:1/-1;font:inherit;font-weight:600;padding:13px;border-radius:8px;border:none;background:var(--ink);color:var(--bg)}
.sec{background:none;border:1px solid var(--line);color:var(--ink);font-weight:400}
.del{color:var(--due)}
footer{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;align-items:flex-end}
footer small{display:block;color:var(--dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
footer .pd{font-size:18px;color:var(--ok);margin-top:2px}
footer .rm{font-size:32px;font-weight:600;color:var(--due);text-align:right}
</style>
</head>
<body>
<header>
  <div class="nav"><button id="prev" aria-label="Vorige maand">‹</button>
    <div><div class="mt" id="mt"></div><div class="per" id="per"></div><div class="per" id="per2"></div></div>
    <button id="next" aria-label="Volgende maand">›</button></div>
  <div class="tl"><span>Totaal</span><b class="num" id="tot"></b></div>
</header>
<main>
  <ul id="list"></ul>
  <form id="f">
    <h3 id="ft">Nieuwe vaste last</h3>
    <input class="w" id="n" placeholder="Naam (bijv. Huur)" maxlength="40" autocomplete="off">
    <input id="a" placeholder="Bedrag (€)" inputmode="decimal" autocomplete="off">
    <input id="d" type="date" aria-label="Datum eerste afschrijving">
    <div class="w hint">Datum van de eerste afschrijving. Daarna komt de last elke maand op die dag terug in het overzicht.</div>
    <button class="btn" id="sv" type="submit">Toevoegen</button>
    <button class="btn sec" id="cx" type="button" hidden>Annuleren</button>
    <button class="btn sec del" id="rm" type="button" hidden>Verwijderen</button>
  </form>
</main>
<footer>
  <div><small>Betaald</small><div class="pd num" id="pd"></div></div>
  <div><small>Nog te betalen</small><div class="rm num" id="rem"></div></div>
</footer>
<script>
const KEY='vasteLasten.v1',$=id=>document.getElementById(id);
let S={costs:[],paid:{}},editing=null;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const eur=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
const fd=(d,w)=>d.toLocaleDateString('nl-NL',w?{weekday:'short',day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'});
const iso=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const day=(y,m,d)=>new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));
const t=new Date();let cur={y:t.getFullYear(),m:t.getMonth()+(t.getDate()>=25?1:0)};
const pdate=x=>{const p=x.split('-');return new Date(+p[0],p[1]-1,+p[2])};
S.costs.forEach(c=>{if(!c.start)c.start='2000-01-'+String(c.day||1).padStart(2,'0')});
// Overzicht: 23e vorige maand t/m 27e. Meetellen: 25e vorige maand t/m 24e.
function occs(c){const s=new Date(cur.y,cur.m-1,23),e=new Date(cur.y,cur.m,27),st=pdate(c.start);
  return [day(cur.y,cur.m-1,st.getDate()),day(cur.y,cur.m,st.getDate())].filter(d=>d>=s&&d<=e&&d>=st)}
function render(){
  const s=new Date(cur.y,cur.m-1,23),e=new Date(cur.y,cur.m,27);
  $('mt').textContent=new Date(cur.y,cur.m,1).toLocaleDateString('nl-NL',{month:'long',year:'numeric'});
  const cs=new Date(cur.y,cur.m-1,25),ce=new Date(cur.y,cur.m,24);
  $('per').textContent='Overzicht: '+fd(s)+' t/m '+fd(e);
  $('per2').textContent='Telt mee: '+fd(cs)+' t/m '+fd(ce);
  const items=[];S.costs.forEach(c=>occs(c).forEach(d=>items.push({c,d})));items.sort((x,y)=>x.d-y.d);
  let total=0,paid=0;const ul=$('list');ul.innerHTML='';
  items.forEach(({c,d})=>{
    const k=c.id+'|'+iso(d),p=!!S.paid[k],on=d>=cs&&d<=ce;if(on){total+=c.amount;if(p)paid+=c.amount}
    const li=document.createElement('li');li.className='row'+(p?' done':'')+(on?'':' off');
    li.innerHTML='<button class="chk" aria-label="Betaald"></button><div class="mid"><div class="nm"></div><div class="dt"></div></div><div class="am num"></div>';
    li.querySelector('.nm').textContent=c.name;li.querySelector('.dt').textContent=fd(d,1)+(on?'':(d<cs?' · telt mee in vorige maand':' · telt mee in volgende maand'));
    li.querySelector('.am').textContent=eur(c.amount);
    li.querySelector('.chk').onclick=()=>{p?delete S.paid[k]:S.paid[k]=1;save();render()};
    li.querySelector('.mid').onclick=()=>edit(c.id);
    ul.appendChild(li)});
  if(!items.length)ul.innerHTML='<div class="empty">Nog geen vaste lasten. Voeg er hieronder een toe.</div>';
  $('tot').textContent=eur(total);$('pd').textContent=eur(paid);$('rem').textContent=eur(total-paid);
}
function edit(id){
  const c=S.costs.find(x=>x.id===id);if(!c)return;editing=id;
  $('n').value=c.name;$('a').value=String(c.amount).replace('.',',');$('d').value=c.start;
  $('ft').textContent='Bewerken';$('sv').textContent='Opslaan';$('cx').hidden=$('rm').hidden=false;
  $('f').scrollIntoView({behavior:'smooth'});
}
function reset(){editing=null;$('f').reset();$('ft').textContent='Nieuwe vaste last';$('sv').textContent='Toevoegen';$('cx').hidden=$('rm').hidden=true}
$('f').onsubmit=e=>{
  e.preventDefault();
  const name=$('n').value.trim(),amount=parseFloat($('a').value.replace(',','.')),start=$('d').value;
  if(!name||!(amount>0)||!start){alert('Vul een naam, bedrag en datum in.');return}
  let c;
  if(editing){c=S.costs.find(x=>x.id===editing);Object.assign(c,{name,amount,start})}
  else{c={id:Date.now().toString(36),name,amount,start};S.costs.push(c)}
  save();reset();
  // Valt de eerste afschrijving buiten de getoonde maand? Ga dan naar de maand waar hij wel staat.
  if(!occs(c).length){const st=pdate(start);cur={y:st.getFullYear(),m:st.getMonth()+(st.getDate()>=25?1:0)}}
  render();document.querySelector('main').scrollTo(0,0);
};
$('cx').onclick=reset;
$('rm').onclick=()=>{if(!confirm('Deze vaste last verwijderen?'))return;
  S.costs=S.costs.filter(x=>x.id!==editing);
  Object.keys(S.paid).forEach(k=>{if(k.startsWith(editing+'|'))delete S.paid[k]});
  save();reset();render()};
$('prev').onclick=()=>{cur.m--;if(cur.m<0){cur.m=11;cur.y--}render()};
$('next').onclick=()=>{cur.m++;if(cur.m>11){cur.m=0;cur.y++}render()};
render();
</script>
</body>
</html>
